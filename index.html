<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>カタログギフト お申込み｜まるひで</title>
<!--
  GitHub Pages（maruhidegift/catalog-form。カタログ・ハガキに印刷済みの URL）に置く転送ページ。
  新しい申込フォーム（出荷アプリ gift.maruhideshop.jp/catalog/）へ、ハガキの QR の ?num=（申込番号）を引き継いで移す。
  公開手順: maruhide-systems の docs/カタログ申込フォーム_公開手順.md 6 章。
-->
<script>
(function () {
  var base = 'https://gift.maruhideshop.jp/catalog/';
  var n = '';
  try { n = (new URLSearchParams(location.search).get('num') || '').replace(/[^0-9A-Za-z]/g, '').slice(0, 20); } catch (e) {}
  var url = base + (n ? '?num=' + encodeURIComponent(n) : '');
  window.__catalogUrl = url;
  location.replace(url);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=https://gift.maruhideshop.jp/catalog/"></noscript>
<style>
body{margin:0;background:#000;color:#efe6d4;font:500 16px/1.8 "Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",Meiryo,sans-serif}
main{max-width:560px;margin:0 auto;padding:64px 20px;text-align:center}
a{display:inline-block;margin-top:16px;background:#c9a463;color:#1a140c;text-decoration:none;font-weight:700;padding:16px 32px;border-radius:999px}
</style>
</head>
<body>
<main>
  <p>カタログギフトのお申込みページは、新しくなりました。</p>
  <a id="go" href="https://gift.maruhideshop.jp/catalog/">お申込みページへ</a>
</main>
<script>
if (window.__catalogUrl) { document.getElementById('go').href = window.__catalogUrl; }
</script>
</body>
</html>
